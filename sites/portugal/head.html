     "text": "You don't need to live in Portugal to charge, but how you pay depends on the network and the charger. Most public chargers are on the MOBI.E network, where you start and pay with the app or card of a MOBI.E electricity supplier, such as Miio. Install it, add a payment card and check it works before your trip. Some chargers, mostly newer fast ones on the mainland, also let you pay on the spot with a bank card or a QR code, no app needed. Tesla Superchargers and other networks outside MOBI.E use their own app. Each charger on this map shows what its operator publishes; check the charger and the final price before you start. MOBI.E explains both ways in its guide for EV drivers."
