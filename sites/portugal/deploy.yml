# Workflow for the PartyTrix/chargeportugal repository (copy it there as
# .github/workflows/deploy.yml). That repo holds nothing else: it builds
# chargeportugal.com from this repo's code and data and publishes it on its own
# GitHub Pages site, because one repo can only serve one custom domain.
# No secrets needed: madeira-chargers is public.
name: Build & deploy chargeportugal.com

on:
  schedule:
    - cron: "7 5,11,17,23 * * *"   # every 6 h; 05:07 UTC picks up the 04:17 data refresh
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: PartyTrix/madeira-chargers
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build-site.mjs portugal _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
