name: Live status

# Every 15 minutes: fetch which plugs are free right now and redeploy
# madeirachargers.com with data/status.json. Nothing is committed.
# (Started every 15 min by the Cloudflare Worker "charger-timer"; the page shows the time.)
on:
  # Every 15 min, started by the Cloudflare Worker "charger-timer" (GitHub's own schedules ran hours late).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Its own group: sharing "site" would let a queued status run replace (cancel)
# a queued daily data refresh. A newer status run replaces an older queued one.
concurrency:
  group: status
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/update-status.mjs
      - run: node scripts/build-site.mjs madeira _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
