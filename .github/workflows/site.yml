name: Refresh data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"   # every day 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  refresh:
    # Only pull new MOBI.E data on the schedule or when started by hand.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/update-data.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "data: refresh chargers from MOBI.E"
          # main may have moved while the refresh ran (e.g. a merged PR).
          git pull --rebase origin main
          git push

  build:
    needs: refresh
    if: always() && needs.refresh.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Live status (also refreshed every 15 min by status.yml)
        run: node scripts/update-status.mjs || echo "::warning::No live status this time"
      - name: Build madeirachargers.com
        run: node scripts/build-site.mjs madeira _site
      - name: Check chargeportugal.com still builds
        # That site is deployed from PartyTrix/chargeportugal (see
        # sites/portugal/deploy.yml); this catches a broken build here first.
        run: node scripts/build-site.mjs portugal _site_portugal
      - name: Check evchargefrance.com still builds (sample of France's data)
        # Deployed from PartyTrix/chargefrance (see sites/france/deploy.yml).
        run: |
          node scripts/test-fr-tarif.mjs
          node scripts/update-france.mjs scripts/test/fr-sample.csv
          node scripts/update-france-status.mjs scripts/test/fr-status-sample.csv
          node scripts/build-site.mjs france _site_france
          node scripts/i18n-keys.mjs --check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Deploy in its own job (GitHub's recommended layout): the artifact is fully
  # registered before deploy-pages looks for it.
  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
