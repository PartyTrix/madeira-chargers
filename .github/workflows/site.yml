name: Refresh data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"   # every day 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  refresh:
    # Only pull new MOBI.E data on the schedule or when started by hand.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/update-data.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "data: refresh chargers from MOBI.E"
          git push

  build:
    needs: refresh
    if: always() && needs.refresh.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check data files are valid JSON
        run: |
          for f in data/*.json data/*.geojson; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "::error file=$f::Invalid JSON"; exit 1; }; done
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html app.js style.css data vendor _site/
          # Cache-bust: phones otherwise mix a new page with old CSS/JS for a while.
          sed -i "s/?v=dev/?v=$(git rev-parse --short HEAD)/g" _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Deploy in its own job (GitHub's recommended layout): the artifact is fully
  # registered before deploy-pages looks for it.
  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
