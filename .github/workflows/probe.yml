name: probe feeds (temporary)
on:
  push:
    branches: [claude/project-thread-2kkx7a]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: OpenStreetMap chargers in Portugal
        run: |
          Q='[out:json][timeout:180];area["ISO3166-1"="PT"]["admin_level"="2"]->.pt;nwr["amenity"="charging_station"](area.pt);out center tags;'
          for u in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            echo "== $u"; curl -sS -m 200 -A "madeira-chargers/1.0 (+https://github.com/PartyTrix/madeira-chargers)" --data-urlencode "data=$Q" "$u" -o osm.json -w "%{http_code}\n"; ls -la osm.json; head -c 300 osm.json; echo
            python3 -c "import json;json.load(open('osm.json'))" 2>/dev/null && break
          done
          python3 - <<'PY'
          import json,collections
          d=json.load(open('osm.json'))['elements']
          print('total',len(d))
          c=collections.Counter((e['tags'].get('operator') or e['tags'].get('brand') or e['tags'].get('network') or '?') for e in d)
          print(c.most_common(40))
          t=[e for e in d if 'tesla' in json.dumps(e['tags']).lower()]
          print('tesla',len(t))
          for e in t[:8]: print(json.dumps(e)[:700])
          keys=collections.Counter(k for e in d for k in e['tags'])
          print(keys.most_common(60))
          PY
